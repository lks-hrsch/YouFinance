cargo-features = ["profile-rustflags", "trim-paths"]

[package]
name = "YouFinance"
version = "0.0.0"
description = "A Tauri App"
authors = ["Lukas Hirsch"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[dependencies]
tauri = { version = "2.0.0-rc", features = [] }
tauri-plugin-log = { version = "2.0.0-rc" }
tauri-plugin-shell = { version = "2.0.0-rc" }
tauri-plugin-fs = { version = "2.0.0-rc" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
libsqlite3-sys = { version = "0.29", features = ["bundled"] }
diesel = { version = "2.2", features = [
    "sqlite",
], git = "https://github.com/diesel-rs/diesel/" }
diesel_migrations = { version = "2.2", features = [
    "sqlite",
], git = "https://github.com/diesel-rs/diesel" }
chrono = "0.4"
typeshare = "1.0"
log = "0.4"
tokio = { version = "1.39.3", features = ["full"] }

[profile.dev]
incremental = true # Compile your binary in smaller steps.
rustflags = ["-Zthreads=8"] # Better compile performance.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.
trim-paths = "all" # Removes potentially privileged information from your binaries.
rustflags = ["-Cdebuginfo=0", "-Zthreads=8"] # Better compile performance.

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
dotenv = "0.15.0"

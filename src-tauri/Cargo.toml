[package]
name = "YouFinance"
version = "0.0.0"
description = "A Tauri App"
authors = ["Lukas Hirsch"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[dependencies]
tauri = { version = "2.0.0-rc", features = [] }
tauri-plugin-devtools = { version = "2.0.0-rc" }
tauri-plugin-log = { version = "2.0.0-rc" }
tauri-plugin-shell = { version = "2.0.0-rc" }
tauri-plugin-fs = { version = "2.0.0-rc" }

tokio = { version = "1.39", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
libsqlite3-sys = { version = "0.29", features = ["bundled"] }
diesel = { version = "2.2", features = [
    "sqlite",
], git = "https://github.com/diesel-rs/diesel/" }
diesel_migrations = { version = "2.2", features = [
    "sqlite",
], git = "https://github.com/diesel-rs/diesel" }
dirs = "5.0"
chrono = "0.4"
typeshare = "1.0"
log = "0.4"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
